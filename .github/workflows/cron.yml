# Scheduled LifeOS jobs (the API has no in-process scheduler; its free host sleeps when idle).
# Needs repository secrets LIFEOS_API_URL (the API's base URL) and LIFEOS_CRON_SECRET (same
# value as the API's). Without them every run is skipped.
#
# Every hour the tick starts the routines that are due in each account's own timezone
# (backend/app/workflows/schedule.py), so a routine starts within an hour of its time. Hourly
# keeps a private repository well inside GitHub's free Actions minutes; with a public
# repository, "0,30 * * * *" halves the delay.
name: Scheduled jobs

on:
  schedule:
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      job:
        description: Job to run now (the routines run for the owner)
        type: choice
        default: tick
        options: [tick, morning_briefing, evening_checkin, weekly_review, monthly_review, expire_proposals]

permissions:
  contents: read

concurrency:
  group: lifeos-cron
  cancel-in-progress: false

jobs:
  trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      API_URL: ${{ secrets.LIFEOS_API_URL }}
      CRON_SECRET: ${{ secrets.LIFEOS_CRON_SECRET }}
      JOB: ${{ inputs.job || 'tick' }}
    steps:
      - name: Call the API
        run: |
          set -eu
          if [ -z "$API_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::notice::LIFEOS_API_URL or LIFEOS_CRON_SECRET is not set; nothing to do."
            exit 0
          fi

          # Wake the instance first: a sleeping free instance takes about a minute to start.
          curl -fsS --retry 6 --retry-delay 15 --retry-all-errors --max-time 90 \
            "$API_URL/api/v1/health" > /dev/null

          for attempt in 1 2 3; do
            ts=$(date +%s)
            sig=$(printf '%s.%s.' "$ts" "$JOB" \
              | openssl dgst -sha256 -hmac "$CRON_SECRET" -hex | awk '{print $NF}')
            # Safe to retry: each routine runs at most once per account and local day.
            if curl -fsS --max-time 180 -X POST \
                -H "X-LifeOS-Timestamp: $ts" -H "X-LifeOS-Signature: $sig" \
                "$API_URL/api/v1/internal/cron/$JOB"; then
              echo
              exit 0
            fi
            sleep 20
          done
          exit 1
