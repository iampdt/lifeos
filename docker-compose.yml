# Local development services. Credentials here are for the local container only.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lifeos
      POSTGRES_PASSWORD: lifeos
      POSTGRES_DB: lifeos
    ports:
      - "5433:5432"
    volumes:
      - lifeos-pg:/var/lib/postgresql/data
      - ./backend/db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeos -d lifeos"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  lifeos-pg:
