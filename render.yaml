# Render Blueprint for the LifeOS API (free web tier, Docker).
# Values marked `sync: false` are entered once in the Render dashboard when the Blueprint is
# created; see docs/deployment.md.
services:
  - type: web
    name: lifeos-api
    runtime: docker
    plan: free
    region: singapore
    # With rootDir set, the Dockerfile path and build context are relative to backend/.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: LIFEOS_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      - key: NOTION_PROFILE
        value: live
      # Kill switch for Notion writes (every write still needs approval). Kept here rather than in
      # the dashboard so a Blueprint sync can't silently flip it. Set "false" to stop all writes.
      - key: LIFEOS_WRITES_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: NOTION_DS_TASKS
        sync: false
      - key: NOTION_DS_GOALS
        sync: false
      - key: NOTION_DS_HABITS
        sync: false
      - key: NOTION_DS_WEEKS
        sync: false
      - key: NOTION_DS_MONTHS
        sync: false
      - key: NOTION_DS_BOOKS
        sync: false
      - key: LIFEOS_API_TOKEN
        generateValue: true
      - key: LIFEOS_CRON_SECRET
        generateValue: true
      # Google sign-in turns on once GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are also set in the
      # dashboard (see docs/deployment.md); until then the password form stays. Connecting Notion
      # turns on with NOTION_OAUTH_CLIENT_ID, NOTION_OAUTH_CLIENT_SECRET and LIFEOS_ENCRYPTION_KEY.
      - key: LIFEOS_PUBLIC_URL
        value: https://lifeos-five-tau.vercel.app

  # Public demo: the same image on an in-memory sample workspace (no Notion). It resets its
  # database on start, so it refuses any database whose name doesn't contain "demo".
  - type: web
    name: lifeos-demo-api
    runtime: docker
    plan: free
    region: singapore
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    autoDeployTrigger: checksPass
    envVars:
      - key: LIFEOS_ENV
        value: production
      - key: LIFEOS_DEMO_MODE
        value: "true"
      - key: TIMEZONE
        value: Asia/Kolkata
      # A smaller daily budget: anyone on the internet can use the demo's chat.
      - key: LLM_DAILY_TOKEN_BUDGET
        value: "150000"
      # Reuse the main service's secrets without anyone copying them; LIFEOS_DEMO_DATABASE swaps
      # the database name in the copied URL, so the demo only ever touches lifeos_demo.
      - key: LIFEOS_DEMO_DATABASE
        value: lifeos_demo
      - key: DATABASE_URL
        fromService:
          type: web
          name: lifeos-api
          envVarKey: DATABASE_URL
      - key: GEMINI_API_KEY
        fromService:
          type: web
          name: lifeos-api
          envVarKey: GEMINI_API_KEY
