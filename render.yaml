# Render Blueprint for the LifeOS API (free web tier, Docker).
# Values marked `sync: false` are entered once in the Render dashboard when the Blueprint is
# created; see docs/deployment.md. One service serves the app and the public demo, and a
# Cloudflare Worker (ops/keep-awake) keeps it awake: 750 free hours a month cover one awake
# instance, not two (decisions I56, I57).
services:
  - type: web
    name: lifeos-api
    runtime: docker
    plan: free
    region: singapore
    # With rootDir set, the Dockerfile path and build context are relative to backend/.
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    # Every push to main. With the CI workflow on, use checksPass: Render never deploys a
    # commit that has no checks under checksPass (decision I58).
    autoDeployTrigger: commit
    envVars:
      - key: LIFEOS_ENV
        value: production
      - key: TIMEZONE
        value: Asia/Kolkata
      # The scheduler ticks in-process every 30 minutes while the instance is awake.
      - key: LIFEOS_TICK_MINUTES
        value: "30"
      # The public demo, under /demo, on this database of the same server (its name must
      # contain "demo"; demo mode resets it on every start).
      - key: LIFEOS_DEMO_MOUNT_DATABASE
        value: lifeos_demo
      - key: NOTION_PROFILE
        value: live
      # Kill switch for Notion writes (every write still needs approval). Kept here rather than in
      # the dashboard so a Blueprint sync can't silently flip it. Set "false" to stop all writes.
      - key: LIFEOS_WRITES_ENABLED
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: NOTION_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # The gateway that answers when Gemini is slow or refusing (decision I60). Its
      # `tollgate:` chain entries are skipped until TOLLGATE_API_KEY is set in the dashboard.
      - key: TOLLGATE_URL
        value: https://tollgate.iampdt.workers.dev
      - key: TOLLGATE_API_KEY
        sync: false
      - key: NOTION_DS_TASKS
        sync: false
      - key: NOTION_DS_GOALS
        sync: false
      - key: NOTION_DS_HABITS
        sync: false
      - key: NOTION_DS_WEEKS
        sync: false
      - key: NOTION_DS_MONTHS
        sync: false
      - key: NOTION_DS_BOOKS
        sync: false
      - key: LIFEOS_API_TOKEN
        generateValue: true
      - key: LIFEOS_CRON_SECRET
        generateValue: true
      # Google sign-in turns on once GOOGLE_CLIENT_ID and GOOGLE_CLIENT_SECRET are also set in the
      # dashboard (see docs/deployment.md); until then the password form stays. Connecting Notion
      # turns on with NOTION_OAUTH_CLIENT_ID, NOTION_OAUTH_CLIENT_SECRET and LIFEOS_ENCRYPTION_KEY.
      - key: LIFEOS_PUBLIC_URL
        value: https://lifeos-five-tau.vercel.app

